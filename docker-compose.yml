services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: [.env]
    environment:
      QDRANT_CLUSTER_ENDPOINT: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      qdrant: {condition: service_started}
      redis: {condition: service_healthy}
    volumes:
      - ./DATA:/app/DATA:ro        # ingest: docker compose run --rm api python -m app.ingestion.processor DATA --wipe
      - hf_cache:/home/appuser/.cache

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file: [.env]
    environment:
      BACKEND_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data:
  hf_cache:
